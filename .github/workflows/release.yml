# ─────────────────────────────────────────────────────────────────────────────
# Daily Life OS — Release Pipeline
# ─────────────────────────────────────────────────────────────────────────────
# Triggers:  push of version tags (v1.0.0, v2.3.1, etc.)
# Strategy:  CI checks first → build APK/AAB → create GitHub Release
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v*" # Triggers on any tag starting with 'v' (e.g., v1.0.0, v2.1.0-beta)

# Only one release at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Step 1: Run CI checks (same as ci.yml — never ship broken code)
  # ───────────────────────────────────────────────────────────────────────────
  ci-checks:
    name: "🔍 CI Checks"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 📐 Check code formatting
        run: dart format --set-exit-if-changed .

      - name: 🔍 Run static analysis
        run: flutter analyze --fatal-infos

      - name: 🧪 Run tests
        run: flutter test --coverage

  # ───────────────────────────────────────────────────────────────────────────
  # Step 2: Build Android artifacts
  # ───────────────────────────────────────────────────────────────────────────
  build-android:
    name: "🏗️ Build Android"
    runs-on: ubuntu-latest
    needs: ci-checks # Only build if CI passes
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # ── Setup Java for Android builds ────────────────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: 📦 Install dependencies
        run: flutter pub get

      # ── Create .env file for build ───────────────────────────────────────
      - name: 🔐 Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # ── Build debug APK ──────────────────────────────────────────────────
      - name: 🏗️ Build Debug APK
        run: flutter build apk --debug

      # ── Build release APK ────────────────────────────────────────────────
      - name: 🏗️ Build Release APK
        run: flutter build apk --release

      # ── Build App Bundle (AAB) for Play Store ────────────────────────────
      - name: 🏗️ Build App Bundle (AAB)
        run: flutter build appbundle --release

      # ── Upload build artifacts ───────────────────────────────────────────
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: 📤 Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

  # ───────────────────────────────────────────────────────────────────────────
  # Step 3: Create GitHub Release with downloadable assets
  # ───────────────────────────────────────────────────────────────────────────
  github-release:
    name: "🏷️ GitHub Release"
    runs-on: ubuntu-latest
    needs: build-android # Only release if build succeeds
    timeout-minutes: 10
    permissions:
      contents: write # Required to create releases

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for release notes generation

      # ── Download build artifacts ─────────────────────────────────────────
      - name: 📥 Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: release-assets/

      - name: 📥 Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-assets/

      - name: 📥 Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: release-assets/

      # ── Rename files for clarity ─────────────────────────────────────────
      - name: 📝 Rename artifacts
        run: |
          mv release-assets/app-debug.apk "release-assets/DailyLifeOS-${{ github.ref_name }}-debug.apk"
          mv release-assets/app-release.apk "release-assets/DailyLifeOS-${{ github.ref_name }}-release.apk"
          mv release-assets/app-release.aab "release-assets/DailyLifeOS-${{ github.ref_name }}.aab"

      # ── Create GitHub Release ────────────────────────────────────────────
      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            release-assets/DailyLifeOS-${{ github.ref_name }}-debug.apk
            release-assets/DailyLifeOS-${{ github.ref_name }}-release.apk
            release-assets/DailyLifeOS-${{ github.ref_name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
