# Static analysis configuration for Daily Life OS.
# CI runs `flutter analyze --fatal-infos`, so every lint below is a hard gate.
include: package:flutter_lints/flutter.yaml

analyzer:
  # `docs/` holds git-ignored reference projects; CI never checks it out, so
  # excluding it keeps local `flutter analyze` identical to the CI gate.
  exclude:
    - docs/**
    - "**/*.g.dart"

linter:
  rules:
    # Resource safety: streams / controllers / subscriptions must be closed.
    - cancel_subscriptions
    - close_sinks
    # Async correctness: no fire-and-forget futures by accident.
    - unawaited_futures
    # No stray debug output in production code (use dart:developer log).
    - avoid_print
    # Performance: const widgets are canonicalised and skip rebuild work.
    - prefer_const_constructors
    - prefer_const_declarations
